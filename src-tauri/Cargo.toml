[package]
name = "qbot"
version = "0.1.0"
description = "Qbot · A股与基金量化工作台（Linux / Windows / Android）"
authors = ["Qbot Contributors"]
edition = "2021"
rust-version = "1.77.2"

# Tauri 移动端（Android）要求 crate 同时产出 staticlib / cdylib / rlib
[lib]
name = "qbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# SQLite：sqlx 自带 bundled sqlite，三端均可编译（含 Android NDK）
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# 走 Rust 侧 reqwest 发起 HTTP，绕开 WebView 的 CORS / 明文流量限制
tauri-plugin-http = "2"
# 量化核心：纯 std 实现，三端原生编译（指标/策略/回测/绩效）
qbot-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
# 由 tauri cli 在构建时注入，用于启用自定义协议等能力
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
